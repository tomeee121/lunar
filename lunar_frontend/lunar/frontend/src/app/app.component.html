<mat-sidenav-container class="app-container">
  <mat-sidenav #drawer="matSidenav" class="sidenav" mode="side" [fixedInViewport]="true">
    <div class="sidenav-content">
      <!-- main navigation - top items -->
      <mat-nav-list class="nav-top">
        <a mat-list-item
           routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="drawer.close()">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>Home</span>
        </a>

        <a mat-list-item
           routerLink="/spaceships"
           routerLinkActive="active"
           (click)="drawer.close()">
          <mat-icon matListItemIcon>rocket_launch</mat-icon>
          <span matListItemTitle>Spaceships</span>
        </a>

        <a mat-list-item
           routerLink="/packages"
           routerLinkActive="active"
           (click)="drawer.close()">
          <mat-icon matListItemIcon>inventory_2</mat-icon>
          <span matListItemTitle>Packages</span>
        </a>
      </mat-nav-list>

      <!-- auth -->
      <div class="nav-bottom">
        <mat-nav-list>
          <a mat-list-item
             routerLink="/bookings"
             routerLinkActive="active"
             (click)="drawer.close()">
            <mat-icon matListItemIcon>event</mat-icon>
            <span matListItemTitle>My bookings</span>
          </a>

          <a *ngIf="!auth.isAuth()"
             mat-list-item
             routerLink="/login"
             routerLinkActive="active"
             (click)="drawer.close()">
            <mat-icon matListItemIcon>login</mat-icon>
            <span matListItemTitle>Login</span>
          </a>

          <a *ngIf="!auth.isAuth()"
             mat-list-item
             routerLink="/register"
             routerLinkActive="active"
             (click)="drawer.close()">
            <mat-icon matListItemIcon>how_to_reg</mat-icon>
            <span matListItemTitle>Register</span>
          </a>

          <a *ngIf="auth.isAuth()"
             mat-list-item
             (click)="auth.logout(); drawer.close()">
            <mat-icon matListItemIcon>logout</mat-icon>
            <span matListItemTitle>Logout</span>
          </a>
        </mat-nav-list>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content cdkScrollable>
    <mat-toolbar class="app-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="brand">Lunar Travel 🚀</span>
    </mat-toolbar>
    <main class="app-main app-bg">
      <router-outlet></router-outlet>
    </main>  </mat-sidenav-content>
</mat-sidenav-container>
