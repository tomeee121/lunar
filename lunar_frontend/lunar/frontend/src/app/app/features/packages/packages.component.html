<section class="packages">
  <h1>Choose Your Package</h1>

  <form class="filters" [formGroup]="form" (ngSubmit)="search()">
    <mat-form-field appearance="fill">
      <mat-label>Travel Date</mat-label>
      <input matInput type="date" formControlName="date" />
      <mat-error *ngIf="form.get('date')?.touched && form.get('date')?.hasError('required')">
        Please select a date.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Passengers</mat-label>
      <input matInput type="number" min="1" formControlName="passengers" />
      <mat-error *ngIf="form.get('passengers')?.touched && (form.get('passengers')?.hasError('required') || form.get('passengers')?.hasError('min'))">
        Passengers must be at least 1.
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="accent" type="submit">
      Search
    </button>
    <button mat-stroked-button color="primary" type="button" (click)="clear()">
      Clear
    </button>
  </form>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div class="cards" *ngIf="!loading">
    <mat-card class="pkg" *ngFor="let p of packages" [class.disabled]="!form.valid">
      <img mat-card-image *ngIf="p.imageUrl" [src]="p.imageUrl" [alt]="p.title" />
      <mat-card-header>
        <mat-card-title>{{ p.title }}</mat-card-title>
        <mat-card-subtitle>{{ p.subtitle }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content *ngIf="p.basePrice">
        <p><strong>Base price:</strong> {{ p.basePrice | number:'1.0-0' }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-raised-button
          color="accent"
          [disabled]="form.invalid"
          (click)="search()">
          Check availability
        </button>
      </mat-card-actions>
    </mat-card>

    <div *ngIf="!packages?.length && !loading" class="hint">
      No packages available.
    </div>
  </div>
</section>
